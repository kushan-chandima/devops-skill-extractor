[tool]
name = "devops-skills-extractor"
version = "0.1.0"
description = "A project to extract and analyze job skills required for DevOps engineers from job postings."
authors = ["Your Name <youremail@example.com>"]
license = "MIT"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
dependencies = [
    "requests",
    "beautifulsoup4",
    "pandas",
    "sqlalchemy",
    "flask",
    "jupyter",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"